version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clearstay:4.1-enterprise
    container_name: clearstay-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "ClearStay Enterprise"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: clearstay_db
      DB_USERNAME: clearstay_user
      DB_PASSWORD: clearstay_secret_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    networks:
      - clearstay-net

  db:
    image: mysql:8.0
    container_name: clearstay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: clearstay_db
      MYSQL_USER: clearstay_user
      MYSQL_PASSWORD: clearstay_secret_password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - clearstay-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "clearstay_user", "-pclearstay_secret_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clearstay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - clearstay-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  redis-data:
  storage-data:

networks:
  clearstay-net:
    driver: bridge

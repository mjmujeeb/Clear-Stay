services:
  - type: web
    name: clearstay-hospitality
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ja
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: clearstay-db
          property: connectionString

databases:
  - name: clearstay-db
    plan: starter
    region: oregon
    databaseName: clearstay_prod
    user: clearstay_user

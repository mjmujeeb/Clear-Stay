databases:
  - name: clearstay-postgres
    databaseName: clearstay
    user: clearstay_user
    plan: free
    region: oregon

services:
  - type: web
    name: clearstay-hospitality
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "ClearStay Enterprise Hospitality"
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_LOCALE
        value: ja
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: clearstay-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_SEEDERS
        value: "true"
